<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernzentrale">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/lernzentrale/icon.png">
<link rel="icon" href="/lernzentrale/icon.png">
<style>:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }</style>
<title>Erd-Atlas</title>
<meta name="description" content="Geographie: Kopernikus, Sonnensystem, Besonderheiten der Erde und Treibhauseffekt.">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  /* Layout: one calm learning path on squared paper, night blue and ochre like an old atlas; diagrams are drawn inline as SVG */
  :root {
    --paper: #f5f7fb;
    --sheet: #ffffff;
    --rule: #dde3ee;
    --line: #c5cfdf;
    --ink: #17223b;
    --ink-soft: #55617a;
    --pen: #1e3a6e;
    --on-pen: #ffffff;
    --ocker: #c98a1b;
    --ocker-ink: #8a5a10;
    --ocker-bg: #fbf1dc;
    --good: #23824f;
    --good-bg: #e2f4e9;
    --almost: #8a5a00;
    --almost-bg: #fdf1d3;
    --bad: #b8460f;
    --bad-bg: #fde9dd;
    --sky: #eaf1fa;
    --ground: #2f6f6a;
    --snow: #f4f9fc;
    --snow-edge: #9bb7cc;
    --cloud: #ffffff;
    --cloud-edge: #7d93b4;
    --gas: #1c1c1c;
    --sun: #f2b632;
    --sun-edge: #d48a10;
    --kurz: #e07b12;
    --lang: #c4372c;
    --sunray: #e8c21e;
    --tree: #6b4a2b;
    --leaf: #5f8f3a;
    --orbit: #b9c4d8;
    --c-co2: #c4372c;
    --c-ch4: #2f5fb3;
    --c-n2o: #2f7d4a;
    --c-f: #7a4fb0;
    --f-hand: 'Playpen Sans', 'Chalkboard SE', 'Comic Sans MS', cursive;
    --f-body: 'Andika', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0b1222;
      --sheet: #121b30;
      --rule: #162038;
      --line: #2a3a58;
      --ink: #e7ecf6;
      --ink-soft: #a3afc6;
      --pen: #9db8f0;
      --on-pen: #0b1222;
      --ocker: #e0a94a;
      --ocker-ink: #f0c27a;
      --ocker-bg: #3a2c12;
      --good: #68d39a;
      --good-bg: #16392a;
      --almost: #f3c35b;
      --almost-bg: #3d3115;
      --bad: #ffa477;
      --bad-bg: #44261a;
      --sky: #0f1a30;
      --ground: #3f8f88;
      --snow: #dfe9f2;
      --snow-edge: #8fb0c8;
      --cloud: #2a3a58;
      --cloud-edge: #9db8f0;
      --gas: #e7ecf6;
      --sun: #f5c24a;
      --sun-edge: #ffd77a;
      --kurz: #f5a54a;
      --lang: #ff7a6e;
      --sunray: #f3d64a;
      --tree: #b08a63;
      --leaf: #86b85c;
      --orbit: #3a4a6a;
      --c-co2: #ff7a6e;
      --c-ch4: #82a8ff;
      --c-n2o: #6fd39a;
      --c-f: #c3a1f0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0b1222;
    --sheet: #121b30;
    --rule: #162038;
    --line: #2a3a58;
    --ink: #e7ecf6;
    --ink-soft: #a3afc6;
    --pen: #9db8f0;
    --on-pen: #0b1222;
    --ocker: #e0a94a;
    --ocker-ink: #f0c27a;
    --ocker-bg: #3a2c12;
    --good: #68d39a;
    --good-bg: #16392a;
    --almost: #f3c35b;
    --almost-bg: #3d3115;
    --bad: #ffa477;
    --bad-bg: #44261a;
    --sky: #0f1a30;
    --ground: #3f8f88;
    --snow: #dfe9f2;
    --snow-edge: #8fb0c8;
    --cloud: #2a3a58;
    --cloud-edge: #9db8f0;
    --gas: #e7ecf6;
    --sun: #f5c24a;
    --sun-edge: #ffd77a;
    --kurz: #f5a54a;
    --lang: #ff7a6e;
    --sunray: #f3d64a;
    --tree: #b08a63;
    --leaf: #86b85c;
    --orbit: #3a4a6a;
    --c-co2: #ff7a6e;
    --c-ch4: #82a8ff;
    --c-n2o: #6fd39a;
    --c-f: #c3a1f0;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background-color: var(--paper);
    background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font: 400 17px/1.5 var(--f-body);
    -webkit-tap-highlight-color: transparent;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  button, input, textarea { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }
  .wrap { max-width: 760px; margin: 0 auto; padding-block: 10px 48px; display: flex; flex-direction: column; gap: 18px; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .hublink { align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; color: var(--pen); font-weight: 700; text-decoration: none; margin-bottom: -10px; }
  .brand { display: inline-flex; align-items: center; gap: 8px; font: 800 clamp(1.45rem, 5vw, 2rem)/1.1 var(--f-hand); color: var(--pen); background: none; border: 0; padding: 0; min-height: 44px; cursor: pointer; text-align: left; }
  .brand svg { width: 34px; height: 34px; flex: none; }
  .pill { font: 700 .95rem/1 var(--f-body); padding: .5em .85em; border-radius: 999px; background: var(--sheet); border: 1.5px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill.due { border-color: var(--ocker); background: var(--ocker-bg); color: var(--ocker-ink); }

  h2 { font: 800 1.35rem/1.2 var(--f-hand); margin: 0; color: var(--ink); text-wrap: balance; }
  h3 { font: 800 1.1rem/1.25 var(--f-hand); margin: 0; }
  p { margin: 0; }
  .muted { color: var(--ink-soft); }
  .small { font-size: .9rem; }
  .label { font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }

  .sheet { background: var(--sheet); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .spread { justify-content: space-between; }
  .center { justify-content: center; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 12px; border: 2px solid var(--pen); background: var(--pen); color: var(--on-pen); font-weight: 700; font-size: 1.05rem; cursor: pointer; text-align: center; }
  .btn.ghost { background: var(--sheet); color: var(--pen); }
  .btn.small { min-height: 48px; padding: 0 14px; font-size: .95rem; }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn[disabled] { opacity: .45; cursor: default; }
  .linkbtn { background: none; border: 0; color: var(--pen); font-weight: 700; padding: 8px 0; min-height: 44px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .iconbtn { width: 48px; height: 48px; flex: none; border-radius: 50%; border: 1.5px solid var(--line); background: var(--sheet); display: grid; place-items: center; cursor: pointer; color: var(--ink); }
  .iconbtn svg { width: 20px; height: 20px; }
  .speak { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .speak .hint { font-size: .82rem; color: var(--ink-soft); }

  /* Home */
  .hero { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 20px; align-items: center; }
  .orbitmap { width: 100%; height: auto; display: block; }
  .count { font: 800 clamp(1.9rem, 7vw, 2.5rem)/1 var(--f-hand); color: var(--pen); font-variant-numeric: tabular-nums; }
  .bar { height: 12px; border-radius: 99px; background: var(--rule); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--pen); border-radius: 99px; transition: width .4s; }
  .bar.thin { height: 8px; }
  .bar.ocker > span { background: var(--ocker); }
  .today { border: 2px solid var(--ocker); background: var(--ocker-bg); border-radius: var(--radius); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .today h2 { color: var(--ocker-ink); }
  .today.calm { border-color: var(--line); background: var(--sheet); }
  .today.calm h2 { color: var(--ink); }
  .forecast { display: flex; flex-wrap: wrap; gap: 6px; }
  .forecast span { font-size: .85rem; padding: 3px 10px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--sheet); font-variant-numeric: tabular-nums; }

  .path { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; position: relative; }
  .path::before { content: ''; position: absolute; left: 27px; top: 20px; bottom: 20px; border-left: 3px dashed var(--line); }
  .station { position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: start; width: 100%; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
  .station .num { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font: 800 1.4rem/1 var(--f-hand); background: var(--sheet); border: 3px solid var(--line); color: var(--ink-soft); z-index: 1; }
  .station.started .num { border-color: var(--pen); color: var(--pen); }
  .station.complete .num { background: var(--pen); border-color: var(--pen); color: var(--on-pen); }
  .station.next .num { border-color: var(--ocker); color: var(--ocker-ink); box-shadow: 0 0 0 5px var(--ocker-bg); }
  .station .card { background: var(--sheet); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .station.next .card { border-color: var(--ocker); }
  .station:active .card { transform: scale(.99); }
  .station .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .stars { color: var(--ocker); letter-spacing: .08em; white-space: nowrap; font-size: 1.15rem; }
  .stars .off { color: var(--line); }
  .steps { display: flex; flex-wrap: wrap; gap: 6px; }
  .steps span { font-size: .8rem; font-weight: 700; padding: 2px 9px; border-radius: 99px; border: 1.5px solid var(--line); color: var(--ink-soft); }
  .steps span.on { border-color: var(--good); color: var(--good); background: var(--good-bg); }
  .mini { display: flex; align-items: center; gap: 8px; font-size: .85rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .mini .bar { flex: 1; }
  .nexttag { font-size: .78rem; font-weight: 800; color: var(--ocker-ink); text-transform: uppercase; letter-spacing: .06em; }

  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .tile { text-align: left; background: var(--sheet); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-height: 110px; min-width: 0; }
  .tile:active { transform: scale(.98); }
  .tile h3 { color: var(--pen); }
  .tile p { font-size: .92rem; color: var(--ink-soft); }

  /* Chapter */
  .stepcard { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: start; }
  .stepcard .dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; border: 2.5px solid var(--line); background: var(--sheet); color: var(--ink-soft); }
  .stepcard.on .dot { border-color: var(--good); background: var(--good); color: var(--on-pen); }
  .stepcard .stack { gap: 8px; }

  /* Learning card */
  .notes ul, .notes ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
  .merk { border: 2.5px solid var(--ocker); background: var(--ocker-bg); border-radius: 10px; padding: 10px 14px; font: 600 1.05rem/1.45 var(--f-hand); }
  .merk .label { display: block; color: var(--ocker-ink); font-family: var(--f-body); }
  .merkpick { display: grid; gap: 8px; }
  .merkpick button { text-align: left; border: 2px solid var(--line); background: var(--sheet); border-radius: 10px; padding: 10px 14px; font: 600 1.02rem/1.45 var(--f-hand); cursor: pointer; min-height: 52px; }
  .merkpick button[aria-pressed="true"] { border-color: var(--ocker); background: var(--ocker-bg); }
  .merkpick b { color: var(--ocker-ink); font-size: 1.15em; }
  .muster { border: 2px dashed var(--ocker); background: color-mix(in srgb, var(--ocker-bg) 60%, var(--sheet)); border-radius: 10px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
  .muster > .label { color: var(--ocker-ink); }
  .task { border-left: 4px solid var(--pen); padding: 4px 0 4px 12px; font-weight: 700; }
  .facts { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; }
  .facts dt { font-weight: 700; }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .pair figure { margin: 0; display: flex; flex-direction: column; align-items: stretch; gap: 6px; text-align: center; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; }
  .pair figcaption { font-weight: 700; }
  .timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
  .timeline li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: stretch; }
  .timeline li b { font: 800 1rem/1.4 var(--f-hand); color: var(--ocker-ink); text-align: right; padding-top: 6px; }
  .timeline li span { border-left: 3px solid var(--ocker); padding: 6px 0 6px 12px; }
  .temps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .temps div { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: center; }
  .temps b { display: block; font: 800 1.8rem/1.1 var(--f-hand); color: var(--pen); }
  .gascards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px; }
  .gascard { border: 1.5px solid var(--line); border-top: 5px solid var(--c); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .gascard dl { margin: 0; display: grid; gap: 2px; }
  .gascard dt { font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); margin-top: 4px; }
  .gascard dd { margin: 0; overflow-wrap: anywhere; }
  .two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .toc { display: flex; flex-wrap: wrap; gap: 8px; }
  .toc a { color: var(--pen); font-weight: 700; padding: 6px 12px; border: 1.5px solid var(--line); border-radius: 99px; text-decoration: none; background: var(--sheet); font-size: .92rem; }

  /* Diagrams */
  .fig { width: 100%; height: auto; display: block; }
  .figwrap { display: flex; flex-direction: column; gap: 6px; }
  .figcap { font-size: .85rem; color: var(--ink-soft); text-align: center; }
  .legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .legend li { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
  .sw { display: inline-block; width: 34px; height: 0; border-top: 3px dotted var(--kurz); vertical-align: middle; flex: none; }
  .sw.lang { border-top: 3px dashed var(--lang); }
  .sw.gelb { border-top: 3px dashed var(--sunray); }
  .sw.dot { width: 9px; height: 9px; border: 0; border-radius: 50%; background: var(--gas); }
  .sw.line { border-top: 3px solid var(--c); }
  .m2 .sky { fill: var(--sky); }
  .m2 .ground { fill: var(--ground); }
  .m2 .snow { fill: var(--snow); stroke: var(--snow-edge); stroke-width: 1.5; }
  .m2 .cloud { fill: var(--cloud); stroke: var(--cloud-edge); stroke-width: 2; stroke-linejoin: round; }
  .m2 .gasdot { fill: var(--gas); }
  .m2 .sunbody { fill: var(--sun); stroke: var(--sun-edge); stroke-width: 2; }
  .m2 .ray { stroke: var(--sun-edge); stroke-width: 2.5; stroke-linecap: round; }
  .m2 .trunk { stroke: var(--tree); stroke-width: 5; stroke-linecap: round; fill: none; }
  .m2 .crown { fill: var(--leaf); opacity: .85; }
  .m2 .lbl { font: 600 12px var(--f-hand); fill: var(--ink); }
  .m2 .divider { stroke: var(--line); stroke-width: 2; }
  .arr line, .arr path { fill: none; stroke-width: 3; stroke-linecap: round; }
  .arr.kurz line { stroke: var(--kurz); stroke-dasharray: .5 6; stroke-width: 3.5; }
  .arr.kurz polygon { fill: var(--kurz); }
  .arr.lang line { stroke: var(--lang); stroke-dasharray: 8 6; }
  .arr.lang polygon { fill: var(--lang); }
  .arr.gelb line { stroke: var(--sunray); stroke-dasharray: 8 6; }
  .arr.gelb polygon { fill: var(--sunray); }
  .badge circle { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.8; }
  .badge text { font: 800 13px var(--f-body); fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
  .badge.ok circle { fill: var(--good); stroke: var(--good); }
  .badge.help circle { fill: var(--almost); stroke: var(--almost); }
  .badge.ok text, .badge.help text { fill: var(--on-pen); }
  .m2.has-sel .step:not(.sel) { opacity: .22; }
  .m2 .step.sel .badge circle { fill: var(--ocker); stroke: var(--ocker-ink); stroke-width: 3; animation: pulse 1.2s ease-in-out infinite; }
  .m2 .step.sel .badge text { fill: #1b1200; }
  @keyframes pulse { 50% { stroke-opacity: .3; } }
  .m3 .axis { stroke: var(--ink); stroke-width: 1.5; fill: none; }
  .m3 .grid { stroke: var(--rule); stroke-width: 1; }
  .m3 .tick { font: 600 11px var(--f-body); fill: var(--ink-soft); }
  .m3 .ttl { font: 700 12px var(--f-body); fill: var(--ink); }
  .m3 .curve { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
  .m3 .band { fill: var(--ocker); opacity: .18; }
  .m3 .bandtxt { font: 700 11px var(--f-body); fill: var(--ocker-ink); }
  .kop .orbit { fill: none; stroke: var(--orbit); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .kop text { font: 700 17px var(--f-body); fill: var(--ink); }
  .ss text { font: 700 12px var(--f-body); fill: var(--ink); }
  .ss .lbl { font: 600 12.5px var(--f-body); fill: var(--ink); text-anchor: middle; }
  .orbitmap .orbit { fill: none; stroke: var(--orbit); stroke-width: 1.6; stroke-dasharray: 3 5; }
  .orbitmap .st { stroke: var(--sheet); stroke-width: 2; }
  .orbitmap text { font: 800 11px var(--f-body); text-anchor: middle; dominant-baseline: central; }

  /* Quiz */
  .qbar { display: flex; align-items: center; gap: 12px; }
  .qbar .track { flex: 1; display: flex; gap: 4px; min-width: 0; }
  .qbar .track span { flex: 1; height: 10px; border-radius: 99px; background: var(--rule); }
  .qbar .track span.ok { background: var(--good); }
  .qbar .track span.almost { background: var(--almost); }
  .qbar .track span.no { background: var(--bad); }
  .qbar .track span.now { background: var(--pen); }
  .prompt { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding-block: 20px; }
  .prompt .fig { max-width: 520px; }
  .question { font: 600 clamp(1.12rem, 4.2vw, 1.4rem)/1.4 var(--f-hand); max-width: 38ch; text-wrap: balance; overflow-wrap: anywhere; }
  .options { display: grid; gap: 10px; }
  .options.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opt { min-height: 58px; text-align: left; padding: 12px 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--sheet); cursor: pointer; font-size: 1.04rem; line-height: 1.35; display: flex; align-items: center; gap: 12px; overflow-wrap: anywhere; min-width: 0; }
  .options.two .opt { justify-content: center; text-align: center; font-weight: 700; }
  .opt.pic { flex-direction: column; padding: 8px; }
  .opt.pic svg { max-width: 220px; }
  .opt:active { transform: scale(.98); }
  .opt .key { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: .8rem; color: var(--ink-soft); }
  .options.two .key { display: none; }
  .opt.correct { border-color: var(--good); background: var(--good-bg); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }

  // ---------- Drawings (all self-drawn SVG) ----------
  function arrow(x1, y1, x2, y2, cls) {
    const a = Math.atan2(y2 - y1, x2 - x1), h = 10, w = 5.5;
    const bx = x2 - h * Math.cos(a), by = y2 - h * Math.sin(a);
    const p = [[x2, y2], [bx + w * Math.sin(a), by - w * Math.cos(a)], [bx - w * Math.sin(a), by + w * Math.cos(a)]].map(q => q.map(v => v.toFixed(1)).join(',')).join(' ');
    return `<g class="arr ${cls}"><line x1="${x1}" y1="${y1}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}"/><polygon points="${p}"/></g>`;
  }
  const cloud = (x, y, s = 1) => `<path class="cloud" transform="translate(${x} ${y}) scale(${s})" d="M-30 10 C-42 10 -42 -6 -28 -6 C-28 -20 -10 -24 -2 -14 C4 -26 26 -24 26 -8 C40 -8 42 10 28 10 Z"/>`;
  const badge = (n, x, y, st = '') => `<g class="badge ${st}"><circle cx="${x}" cy="${y}" r="11"/><text x="${x}" y="${y + 0.5}">${n}</text></g>`;
  function dotsIn(n, seed, x0, x1, y0, y1, avoid = []) {
    let s = seed, out = '';
    const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    let made = 0, tries = 0;
    while (made < n && tries < 500) {
      tries++;
      const x = x0 + rnd() * (x1 - x0), y = y0 + rnd() * (y1 - y0);
      if (avoid.some(([ax, ay, r]) => Math.hypot(x - ax, y - ay) < r)) continue;
      out += `<circle class="gasdot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.4"/>`;
      made++;
    }
    return out;
  }

  // Old idea vs. Copernicus
  function kopSVG(kind, labels = true) {
    const R = [36, 60, 86];
    const at = (r, deg) => [110 + r * Math.cos(deg * Math.PI / 180), 110 + r * Math.sin(deg * Math.PI / 180)].map(v => v.toFixed(1));
    const body = (r, deg, rad, fill, name) => { const [x, y] = at(r, deg); return `<circle cx="${x}" cy="${y}" r="${rad}" fill="${fill}" stroke="rgba(0,0,0,.25)"/>${name && labels ? `<text x="${x}" y="${(+y + rad + 16).toFixed(1)}" text-anchor="middle">${name}</text>` : ''}`; };
    const earth = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#3f7fd6" stroke="rgba(0,0,0,.3)"/><path d="M${x - r * .5} ${y - r * .3} q${r * .3} ${-r * .4} ${r * .7} ${-r * .1} q${-r * .1} ${r * .4} ${-r * .5} ${r * .5} Z M${x + r * .1} ${y + r * .25} q${r * .4} 0 ${r * .5} ${r * .35} q${-r * .4} ${r * .2} ${-r * .6} ${-r * .1} Z" fill="#5fae54"/>`;
    const sun = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r + 5}" fill="var(--sun)" opacity=".35"/><circle cx="${x}" cy="${y}" r="${r}" fill="var(--sun)" stroke="var(--sun-edge)" stroke-width="2"/>`;
    let s = `<svg class="fig kop" viewBox="0 0 220 220" role="img" aria-label="${kind === 'alt' ? `${labels ? 'Die alte Vorstellung: ' : ''}Die Erde in der Mitte, Mond, Sonne und Mars kreisen um sie.` : `${labels ? 'Kopernikus’ Idee: ' : ''}Die Sonne in der Mitte, die Erde und andere Planeten kreisen um sie.`}">`;
    s += R.map(r => `<circle class="orbit" cx="110" cy="110" r="${r}"/>`).join('');
    if (kind === 'alt') {
      s += earth(110, 110, 15) + (labels ? '<text x="110" y="144" text-anchor="middle">Erde</text>' : '');

    }
    return s + '</svg>';
  }

      : `<section class="today calm"><h2>${anySeen ? 'Heute ist nichts fällig' : 'So funktioniert der Erd-Atlas'}</h2><p>${anySeen ? 'Super, alles wiederholt. Mach im Lernpfad weiter oder schau morgen wieder vorbei.' : 'Geh die fünf Kapitel der Reihe nach durch: erst lesen, dann sofort abrufen, dann anwenden. Was du gelernt hast, kommt nach 1, 3, 7 und 14 Tagen zur Wiederholung wieder.'}</p>${forecast() ? `<div class="forecast" aria-label="Nächste Wiederholungen">${forecast()}</div>` : ''}</section>`;
    const stations = CHAPTERS.map(c => {
      const cs = chCards(c.n), d = cs.filter(k => mastered(k.id)).length, p = pathOf(c.n);
      const started = cs.some(k => seen(k.id)) || p.e;
      return `<li><button class="station ${started ? 'started' : ''} ${pathDone(c.n) ? 'complete' : ''} ${nx === c.n ? 'next' : ''}" data-act="chapter" data-arg="${c.n}">
        <span class="num">${c.n}</span>
        <span class="card">
          <span class="top"><h3>${esc(c.title)}</h3>${starHtml(c.n)}</span>
          ${nx === c.n ? `<span class="nexttag">${started ? 'Hier geht es weiter' : 'Als Nächstes'}</span>` : ''}
          <span class="muted small">${esc(c.sub)}</span>
          <span class="steps"><span class="${p.e ? 'on' : ''}">Erklären</span><span class="${p.a ? 'on' : ''}">Abrufen</span><span class="${p.w ? 'on' : ''}">Anwenden</span></span>
          <span class="mini"><span class="bar thin ocker" aria-hidden="true"><span style="width:${Math.round(100 * d / cs.length)}%"></span></span>${d}/${cs.length} gelernt</span>
        </span></button></li>`;
    }).join('');
    return `
      <section class="sheet hero">
        ${orbitMap()}
        <div class="stats stack" style="gap:8px">
          <span class="label">Dein Lernstand</span>
          <div class="count">${done} von ${TOTAL}</div>
          <div>Karten gelernt. Eine Karte ist gelernt, wenn du sie ${MASTER}-mal hintereinander richtig weißt, jedes Mal ein paar Tage später.</div>
          <div class="bar" aria-hidden="true"><span style="width:${Math.round(100 * done / TOTAL)}%"></span></div>
          <div class="muted small">Sterne pro Kapitel: ★ Lernpfad geschafft · ★★ jede Karte einmal richtig · ★★★ alles gelernt.</div>
        </div>
      </section>
      ${todayBox}
      <section class="stack"><h2>Lernpfad</h2><ol class="path">${stations}</ol></section>
      <section class="tiles">
        <button class="tile" data-act="probe"><h3>Probe-Modus</h3><p>10 gemischte Fragen wie in einer Ex. Danach vergleichst du mit dem Erwartungshorizont.</p></button>
        <button class="tile" data-act="zettel"><h3>Lernzettel</h3><p>Alles aus dem Heft zum Nachlesen und Anhören.</p></button>
      </section>
      <div class="row spread">
        <button class="linkbtn" data-act="parents">Für Eltern</button>
        <span class="muted small">Aus dem Heft „Geographie“</span>
      </div>`;
  }

  function renderChapter() {
    const c = CHAP[chap], p = pathOf(chap), pa = PATH[chap];
    const nQ = list => list.reduce((s, x) => s + (GROUPS[x] ? 1 : 1), 0);
    const cs = chCards(chap), d = cs.filter(k => mastered(k.id)).length;
    const step = (on, n, title, text, btn) => `<section class="sheet stepcard ${on ? 'on' : ''}"><span class="dot">${on ? '✓' : n}</span><div class="stack"><h3>${title}</h3><p class="muted">${text}</p><div class="row">${btn}</div></div></section>`;
    const vid = c.video ? VID[c.video] : null;
    return `
      <div class="qbar">${closeBtn('home', 'Zurück zum Lernpfad')}<h2 style="flex:1">Kapitel ${c.n}: ${esc(c.title)}</h2>${starHtml(c.n)}</div>
      <p class="muted">${esc(c.sub)} · ${d} von ${cs.length} Karten gelernt</p>
      ${step(p.e, 1, 'Erklären', `Lernkarte lesen oder anhören${vid ? ', dazu das Video' : ''}.`, `<button class="btn ${p.e ? 'ghost' : ''}" data-act="learn">${p.e ? 'Nochmal lesen' : 'Lernkarte öffnen'}</button>${vid ? `<button class="btn ghost" data-act="openVideo" data-arg="${vid.id}">${ICON_PLAY}Video</button>` : ''}`)}
      ${step(p.a, 2, 'Abrufen', `${nQ(pa.abruf)} Fragen ohne Spicken, direkt nach dem Lesen.`, `<button class="btn ${p.a ? 'ghost' : ''}" data-act="path" data-arg="abruf">${p.a ? 'Nochmal abrufen' : 'Abrufen'}</button>`)}
      ${step(p.w, 3, 'Anwenden', `${nQ(pa.anwenden)} Aufgaben: Grafiken, Ordnen, Erklären.`, `<button class="btn ${p.w ? 'ghost' : ''}" data-act="path" data-arg="anwenden">${p.w ? 'Nochmal anwenden' : 'Anwenden'}</button>`)}
      <p class="muted small">Zählt für die Wiederholung: Jede Karte kommt nach 1, 3, 7 und 14 Tagen wieder. Wer zwischendurch nochmal übt, festigt das Wissen, die Karte steigt aber erst am fälligen Tag auf.</p>`;
  }

  function renderLearn() {
    const c = CHAP[chap], l = LEARN[chap]();
    const vid = c.video ? VID[c.video] : null;
    const vst = vid ? P.vid[vid.id] || {} : null;
    return `
      <div class="qbar">${closeBtn('chapter', 'Zurück zum Kapitel', chap)}<h2 style="flex:1">Lernkarte ${c.n}: ${esc(c.title)}</h2></div>
      <section class="sheet stack notes">${l.html}${speakBtn(l.say)}</section>
      ${vid ? `<button class="vcard" data-act="openVideo" data-arg="${vid.id}"><span class="play">${ICON_PLAY}</span><span class="stack" style="gap:2px"><strong>Video: ${esc(vid.title)}</strong><span class="muted">${vst.watched ? 'Schon geschaut' : 'Erst raten, dann schauen, dann 2 Fragen'}</span></span></button>` : ''}
      <div class="row center"><button class="btn" data-act="learned">Verstanden: weiter zum Abrufen</button></div>`;
  }

  // ---------- Video ----------
  function renderVideo() {
    const v = VID[vd.id];
    const st = P.vid[v.id] || {};
    let body;
    if (vd.step === 'pre') {
      body = `
        <section class="sheet prompt"><span class="label">Rate vorher</span><div class="question">${esc(v.pre.q)}</div><p class="muted">Kein Problem, wenn du es nicht weißt. Tipp einfach. Im Video kommt die Antwort.</p></section>
        <div class="options two">${v.pre.options.map((o, i) => `<button class="opt" data-act="preGuess" data-arg="${i}">${esc(o)}</button>`).join('')}</div>`;
    } else {
      const base = `videos/${v.file}`;
      body = `
        ${st.guess !== undefined ? `<p class="muted">Dein Tipp vorher: <strong>${esc(v.pre.options[st.guess])}</strong>. Ob er stimmt, erfährst du nach den Fragen.</p>` : ''}
        <div id="vwrap">${vd.missing ? videoMissing() : `<div class="vbox"><video id="vid" controls playsinline preload="none" poster="${base}.jpg"><source src="${base}.mp4" type="video/mp4"><track kind="captions" srclang="de" label="Deutsch" src="${base}.vtt" default></video></div>`}</div>
        <div class="row spread"><button class="btn ghost" data-act="chapter" data-arg="${v.ch}">Zum Kapitel</button><button class="btn" data-act="videoQuiz">Zu den 2 Fragen</button></div>`;
    }
    return `<div class="qbar">${closeBtn('chapter', 'Zurück zum Kapitel', v.ch)}<h2 style="flex:1">Video: ${esc(v.title)}</h2></div>${body}`;
  }
  const videoMissing = () => '<div class="vph"><b>Video folgt bald</b><span>Das Video ist noch nicht fertig. Die Fragen kannst du trotzdem schon beantworten, alles steht auch auf der Lernkarte.</span></div>';
  function wireVideo() {
    const el = document.getElementById('vid');
    if (!el) return;
    const v = VID[vd.id];
    const fail = () => {
      if (vd.missing) return;
      vd.missing = true;
      const w = document.getElementById('vwrap');
      if (w) w.innerHTML = videoMissing();
    };
    el.addEventListener('error', fail, true);
    el.querySelector('source')?.addEventListener('error', fail);
    const mark = () => { P.vid[v.id] = { ...(P.vid[v.id] || {}), watched: true }; save(); };
    el.addEventListener('play', mark, { once: true });
    el.addEventListener('ended', mark);
    const probe = new Image();
    probe.onerror = fail;
    probe.src = `videos/${v.file}.jpg`;
  }

  // ---------- Text matching ----------
  function norm(s) {
    return String(s).toLowerCase().replace(/[₀-₉]/g, d => String(d.charCodeAt(0) - 8320)).replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/ń/g, 'n')
      .replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
  }
  const stripArticles = n => n.replace(/^(der|die|das|ein|eine|einen|einem|in|im|als) /, '');
  function lev(a, b) {
    const d = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      let prev = d[0];
      d[0] = i;
      for (let j = 1; j <= b.length; j++) {
        const tmp = d[j];
        d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
        prev = tmp;
      }
    }
    return d[b.length];
  }
  const tol = len => len <= 4 ? 0 : len <= 7 ? 1 : 2;
  function synHit(n, syns) {
    return syns.some(syn => n === syn || ` ${n} `.includes(` ${syn} `) || (syn.length >= 5 && n.includes(syn)) || lev(n, syn) <= tol(syn.length)
      || n.split(' ').some(w => w.length >= 5 && lev(w, syn) <= tol(syn.length)));
  }
  const NUM_WORDS = { eins: 1, ein: 1, einen: 1, zwei: 2, drei: 3, vier: 4, fuenf: 5, sechs: 6, sieben: 7, acht: 8, neun: 9, zehn: 10, elf: 11, zwoelf: 12, fuenfzehn: 15, achtzehn: 18, dritte: 3, dritter: 3 };
  function parseNum(s) {
    const w = norm(s).replace(/^minus /, '-').split(' ');
    const hit = w.map(x => x.replace(/^-/, '')).find(x => NUM_WORDS[x] !== undefined);
    if (hit && !/\d/.test(s)) return (w.join(' ').startsWith('-') || /minus/.test(norm(s)) ? -1 : 1) * NUM_WORDS[hit];
    const t = String(s).toLowerCase().replace(/−/g, '-').replace(/minus\s*/g, '-').replace(/(\d)[.\s](\d{3})\b/g, '$1$2').replace(/,/g, '.');
    const m = t.match(/-?\s*\d+(\.\d+)?/);
    return m ? Number(m[0].replace(/\s/g, '')) : NaN;
  }
  function fieldOk(f, val) {
    if (f.num !== undefined) return parseNum(val) === f.num;
    const n = stripArticles(norm(val));
    if (!n) return false;
    return f.acc.some(a => n === a || lev(n, a) <= tol(a.length) || (a.length >= 4 && ` ${n} `.includes(` ${a} `)));
  }
  const keyHit = (text, keys) => { const n = norm(text); return !!n && keys.some(k => n.includes(k)); };
  function checkRecall(card, entries) {
    const found = new Map(), extra = [], seq = [];
    entries.forEach(e => {
      const n = norm(e);
      if (!n) return;
      const hits = card.items.filter(it => synHit(n, it.syn));
      hits.forEach(it => { if (!found.has(it.name)) found.set(it.name, e); seq.push(card.items.indexOf(it)); });
      if (!hits.length) {
        const hint = (card.hints || []).find(h => synHit(n, h.syn));
        extra.push({ e, hint: hint ? hint.text : '' });
      }
    });
    const missing = card.items.filter(it => !found.has(it.name));
    const inOrder = card.ordered ? seq.length === card.items.length && seq.every((x, i) => x === i) : true;
    return { found, missing, extra, inOrder, seq };
  }

  // ---------- Rounds ----------
  const itemOf = x => GROUPS[x] ? { type: GROUPS[x].type, ids: GROUPS[x].ids.slice() } : { type: CARD[x].type, ids: [x] };
  function spread(list) {
    const out = [], rest = list.slice();
    while (rest.length) {
      const prev = out[out.length - 1];
      let i = rest.findIndex(c => !prev || CARD[c].ch !== CARD[prev].ch);
      if (i < 0) i = 0;
      out.push(rest.splice(i, 1)[0]);
    }
    return out;
  }
  function startRound(kind, items, extra = {}) {
    round = { kind, items, idx: 0, log: [], newly: [], ...extra };
    round.q = makeQ(items[0]);
    show('quiz');
  }
  function makeQ(item) {
    const q = { type: item.type, ids: item.ids, retry: !!item.retry, vals: [], done: false };
    const card = CARD[item.ids[0]];
    if (item.type === 'mc') {
      const m = card.mk ? card.mk() : card.options ? { prompt: card.prompt, options: card.options.slice(), correct: card.correct, two: card.two } : (() => { const o = shuffle([card.right, ...shuffle(card.wrongs).slice(0, 3)]); return { prompt: card.prompt, options: o, correct: o.indexOf(card.right) }; })();
      if (card.options && !card.fixed) { const o = shuffle(m.options.map((t, i) => [t, i])); m.correct = o.findIndex(([, i]) => i === card.correct); m.options = o.map(([t]) => t); }
      Object.assign(q, m);
    } else if (item.type === 'order') {
      q.bank = shuffle(card.items.map((_, i) => i));
      q.placed = [];
      q.help = new Set();
      q.errors = 0;
      q.miss = 0;
    } else if (item.type === 'recall') {
      q.entries = [];
    } else if (item.type === 'self') {
      q.rate = {};
      q.phase = 'write';
    } else if (item.type === 'm2') {
      q.pos = 0;
      q.res = {};
      q.fb = null;
      q.bank = item.ids.length > 1 ? shuffle(item.ids.map(id => CARD[id].step)) : shuffle([CARD[item.ids[0]].step, ...shuffle([1, 2, 3, 4, 5, 6, 7].filter(n => n !== CARD[item.ids[0]].step)).slice(0, 3)]);
    } else if (item.type === 'sort') {
      q.order = shuffle(item.ids);
      q.placed = {};
      q.sel = q.order[0];
      q.fb = null;
    }
    return q;
  }
  function log(id, ok, extra = {}) {
    if (round.q.retry) { round.log.push({ id, ok, retry: true }); return { newly: false, counted: false, due: P.c[id]?.due || today(), retry: true }; }
    const r = record(id, ok, extra.sure);
    round.log.push({ id, ok, sure: extra.sure });
    if (r.newly) round.newly.push(id);
    return r;
  }
  function finishItem(ok) {
    round.q.done = true;
    round.q.allOk = ok;
    const it = round.items[round.idx];
    if (!ok && !it.retry && ['mc', 'type'].includes(it.type)) round.items.push({ ...it, retry: true });
    save();
    render();
    focusFeedback();
  }
  function focusFeedback() {
    const f = document.querySelector('.feedback:last-of-type') || document.querySelector('.feedback');
    f?.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' });
  }
  function next() {
    round.idx++;
    if (round.idx >= round.items.length) return finishRound();
    round.q = makeQ(round.items[round.idx]);
    render();
    window.scrollTo(0, 0);
  }
  function finishRound() {
    if (round.kind === 'abruf' || round.kind === 'anwenden') {
      const p = P.path[round.ch] = { ...pathOf(round.ch) };
      p[round.kind === 'abruf' ? 'a' : 'w'] = true;
    }
    save();
    show('result');
  }
  const qLabel = () => round.kind === 'review' ? `Wiederholung · Kapitel ${CARD[round.q.ids[0]].ch}` : round.kind === 'video' ? 'Video-Fragen' : `Kapitel ${round.ch} · ${round.kind === 'abruf' ? 'Abrufen' : 'Anwenden'}`;
  function trackHtml() {
    return round.items.map((it, i) => {
      if (i === round.idx && !round.q.done) return '<span class="now"></span>';
      if (i > round.idx || (i === round.idx && !round.q.done)) return '<span></span>';
      const ls = round.log.filter(l => it.ids.includes(l.id) && !!l.retry === !!it.retry);
      const okAll = ls.length && ls.every(l => l.ok);
      return `<span class="${okAll ? 'ok' : ls.some(l => l.ok) ? 'almost' : 'no'}"></span>`;
    }).join('');
  }

  function renderQuiz() {
    const q = round.q, card = CARD[q.ids[0]];
    const body = { mc: renderMC, type: renderType, order: renderOrder, recall: renderRecall, self: renderSelf, m2: renderM2, sort: renderSort }[q.type](q, card);
    return `
      <div class="qbar">${closeBtn('quit', 'Runde beenden')}<div class="track" aria-label="Frage ${round.idx + 1} von ${round.items.length}">${trackHtml()}</div></div>
      ${q.retry ? '<p class="muted small">Gleich nochmal, damit es sitzt. Diese Wiederholung zählt nicht für die Karte.</p>' : ''}
      ${body}`;
  }
  const nextBtn = () => `<button class="btn" data-act="next" id="nextBtn">${round.idx + 1 >= round.items.length ? 'Fertig' : 'Weiter'}</button>`;
  const visualOf = (card, after) => (after && card.visualAfter ? card.visualAfter() : card.visual ? card.visual() : '');

  function renderMC(q, card) {
    const a = q.answer;
    const opts = q.options.map((o, i) => {
      let cls = '';
      if (a) cls = i === q.correct ? 'correct' : i === a.i ? 'wrong' : 'dim';
      else if (q.pending === i) cls = 'chosen';
      return `<button class="opt ${q.html ? 'pic' : ''} ${cls}" data-act="answer" data-arg="${i}" ${a ? 'disabled' : ''}>${q.two || q.html ? '' : `<span class="key">${i + 1}</span>`}${q.html ? o : `<span>${esc(o)}</span>`}${q.html && a ? `<span>${esc(q.names[i])}</span>` : ''}</button>`;
    }).join('');
    const conf = q.pending !== undefined && !a ? `<section class="confask"><h3>Wie sicher bist du?</h3><div class="options two"><button class="btn" data-act="conf" data-arg="1">Ganz sicher</button><button class="btn ghost" data-act="conf" data-arg="0">Eher geraten</button></div><button class="linkbtn" data-act="unpick">Doch eine andere Antwort</button></section>` : '';
    const right = q.html ? q.names[q.correct] : q.options[q.correct];
    const fb = a ? `<section class="feedback ${a.ok ? '' : 'no'}"><div class="verdict">${a.ok ? esc(pick(PRAISE)) : 'Nicht ganz.'}</div>${a.ok ? '' : `<p>Richtig ist: <strong>${esc(right)}</strong></p>`}${heftQuote(card.heft)}${whenLine(a.r)}<div class="row spread">${speakBtn(card.heft, 'Heftsatz vorlesen')}${nextBtn()}</div></section>` : '';
    return `
      <section class="sheet prompt"><span class="label">${esc(qLabel())}</span>${visualOf(card, !!a)}<div class="question">${esc(q.prompt)}</div>${a ? '' : speakBtn(q.prompt + (q.html ? '' : ' ' + q.options.join('. ')))}</section>
      <div class="options ${q.two || q.html ? 'two' : ''}">${opts}</div>
      ${conf}${fb}`;
  }

  function renderType(q, card) {
    const a = q.answer;
    const input = (i, f) => `<input class="tin ${a ? (a.res[i] ? 'ok' : 'no') : ''}" data-in="${i}" type="text" value="${esc(q.vals[i] || '')}" ${a ? 'disabled' : ''} enterkeyhint="next" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-label="Lücke ${i + 1}" style="${card.tpl ? `width:${Math.max(5, (f.acc?.[0]?.length || 4) + 1)}ch` : ''}">`;
    let field;
    if (card.tpl) {
      const sw = { K: '<span class="sw"></span>', L: '<span class="sw lang"></span>', D: '<span class="sw dot"></span>' };
      field = `<p class="tline">${card.tpl.split('|').map(line => esc(line).replace(/\{([KLD])\}/g, (_, k) => sw[k]).replace(/\{(\d)\}/g, (_, i) => input(Number(i), card.fields[Number(i)]))).join('<br>')}</p>`;
    } else field = `<div class="answer">${input(0, card.fields[0])}${card.fields[0].unit ? `<span style="align-self:center;font-weight:700">${esc(card.fields[0].unit)}</span>` : ''}</div>`;
    const actions = a ? '' : `<div class="stack" style="gap:8px"><span class="label">Prüfen: Wie sicher bist du?</span><div class="options two"><button class="btn" data-act="typeCheck" data-arg="1">Ganz sicher</button><button class="btn ghost" data-act="typeCheck" data-arg="0">Eher geraten</button></div><button class="linkbtn" data-act="typeCheck" data-arg="x">Weiß ich nicht</button></div>`;
    const minusHint = a && !a.ok && card.fields.some((f, i) => f.minus && !a.res[i] && parseNum(q.vals[i]) === -f.num) ? '<p>Fast! Achte auf das <strong>Minus</strong>.</p>' : '';
    const fb = a ? `<section class="feedback ${a.ok ? '' : a.res.some(Boolean) ? 'almost' : 'no'}"><div class="verdict">${a.ok ? esc(pick(PRAISE)) : a.res.some(Boolean) ? 'Teilweise richtig.' : 'Nicht ganz.'}</div>${a.ok ? '' : `<p>Lösung: <strong>${esc(card.solution)}</strong></p>`}${minusHint}${heftQuote(card.heft)}${whenLine(a.r)}<div class="row spread">${speakBtn(card.heft, 'Heftsatz vorlesen')}${nextBtn()}</div></section>` : '';
    return `
      <section class="sheet prompt"><span class="label">${esc(qLabel())}</span>${visualOf(card, !!a)}<div class="question">${esc(card.prompt)}</div>${a ? '' : speakBtn(card.prompt + (card.tpl ? ' ' + card.tpl.replace(/\{[KLD]\}/g, '').replace(/\{\d\}/g, ' Lücke ').replace(/\|/g, '. ') : ''))}</section>
      <section class="sheet stack"><form data-form="type" class="stack" autocomplete="off">${field}</form>${actions}</section>
      ${fb}`;
  }

  function renderOrder(q, card) {
    const items = card.items;
    const icon = i => card.planets ? planetIcon(i) : '';
    const chain = q.placed.map((k, i) => `<li class="${q.help.has(k) ? 'help' : ''}"><b>${i + 1}</b>${icon(k)}<span>${esc(items[k])}</span></li>`).join('');
    const left = q.bank.filter(k => !q.placed.includes(k));
    const fb = q.done ? `<section class="feedback ${q.allOk ? '' : 'almost'}"><div class="verdict">${q.allOk ? 'Alles in der richtigen Reihenfolge.' : `Geschafft, mit ${q.errors} ${q.errors === 1 ? 'Fehler' : 'Fehlern'}.`}</div>${q.allOk ? '' : '<p>Oben steht die Reihenfolge jetzt richtig. Orange Schritte waren knifflig.</p>'}${heftQuote(card.heft)}${whenLine(q.r)}<div class="row spread">${speakBtn(card.heft, 'Heftsatz vorlesen')}${nextBtn()}</div></section>` : '';
    return `

  function renderRecall(q, card) {

          ${r.missing.length ? `<p><strong>Vergessen:</strong></p><ul class="reslist">${r.missing.map(it => `<li><span class="no-t">✗</span><strong>${esc(it.name)}</strong></li>`).join('')}</ul>` : ''}

  function renderSelf(q) {

  // ---------- Probe mode ----------
  function pickProbe() {
    let ids = [];
    PROBE_PLAN.forEach(([ch, n]) => ids.push(...shuffle(PROBE.filter(p => p.ch === ch).map(p => p.id)).slice(0, n)));
    if (!ids.some(id => TRANSFER.includes(id))) {
      const t = pick(TRANSFER), ch = PRB[t].ch;
      const swap = ids.findIndex(id => PRB[id].ch === ch);
      ids[swap] = t;
    }
    return ids;
  }
  function autoCrit(p, c, val) {
    if (c.auto === 'planetsAll' || c.auto === 'planetsOrder') {
      const seq = [];
      val.split(/[,;\n]|\s+und\s+|\s+/).forEach(w => { const n = norm(w); const i = PLANETS.findIndex(pl => n && lev(n, norm(pl)) <= tol(pl.length)); if (i >= 0 && !seq.includes(i)) seq.push(i); });
      return c.auto === 'planetsAll' ? seq.length === 8 : seq.length === 8 && seq.every((x, i) => x === i);
    }
    return keyHit(val, c.k);
  }
  function renderProbe() {
    if (!pr) return '';
    if (pr.idx >= pr.ids.length) return renderProbeEnd();
    const p = PRB[pr.ids[pr.idx]];
    const val = pr.vals[p.id] || '';
    const head = `<div class="qbar">${closeBtn('home', 'Probe beenden')}<div class="track" aria-label="Aufgabe ${pr.idx + 1} von ${pr.ids.length}">${pr.ids.map((_, i) => `<span class="${i < pr.idx ? 'ok' : i === pr.idx ? 'now' : ''}"></span>`).join('')}</div></div>`;
    if (pr.phase === 'write') {
      return `${head}
        <section class="sheet prompt"><span class="label">Probe · Aufgabe ${pr.idx + 1} von ${pr.ids.length}</span>${p.visual ? p.visual() : ''}<div class="question">${esc(p.q)}</div>${speakBtn(p.q)}</section>
        <section class="sheet stack"><label class="stack" style="gap:6px"><span class="label">Deine Antwort</span><textarea class="tin" data-pin="${p.id}" rows="5" spellcheck="true">${esc(val)}</textarea></label>
        <div class="row spread"><button class="linkbtn" data-act="prShow">Weiß ich nicht</button><button class="btn" data-act="prShow">Fertig: Erwartungshorizont</button></div></section>`;
    }
    const chk = pr.checks[p.id];
    const pts = Math.min(pmax(p), chk.filter(Boolean).length);
    return `${head}
      <section class="sheet stack"><span class="label">Aufgabe ${pr.idx + 1}</span><h3>${esc(p.q)}</h3><span class="label">Deine Antwort</span><div class="yours">${val.trim() ? esc(val) : '<span class="muted">(nichts geschrieben)</span>'}</div></section>
      <section class="sheet stack"><h3>Erwartungshorizont</h3>
        <p class="muted small">Hake an, was in deiner Antwort steht. Vorausgewählt ist, was der Erd-Atlas als Stichwort gefunden hat. Prüf es und sei ehrlich, das hilft dir am meisten.${p.max && p.max < p.crit.length ? ` Es reichen ${p.max} Punkte aus der Liste.` : ''}</p>
        ${p.crit.map((c, i) => `<button class="critbtn" data-act="prCheck" data-arg="${i}" aria-pressed="${!!chk[i]}"><span class="box" aria-hidden="true">${chk[i] ? '✓' : ''}</span><span>${esc(c.t)}</span></button>`).join('')}
        ${p.model ? musterBox(p.model) : heftQuote(p.heft)}
        <p class="muted small">${pts === pmax(p) ? 'Alles drin.' : 'Was fehlt, schaust du dir im Lernzettel nochmal an.'}</p>
        <div class="row center"><button class="btn" data-act="prNext">${pr.idx + 1 >= pr.ids.length ? 'Probe abschließen' : 'Nächste Aufgabe'}</button></div>
      </section>`;
  }
  function renderProbeEnd() {
    const rows = pr.ids.map(id => { const p = PRB[id], got = Math.min(pmax(p), pr.checks[id].filter(Boolean).length); return { p, full: got === pmax(p) }; });
    const good = rows.filter(r => r.full), again = rows.filter(r => !r.full);
    return `
      <div class="qbar">${closeBtn()}<h2 style="flex:1">Probe fertig</h2></div>
      <section class="sheet stack"><p>Du hast alle ${pr.ids.length} Aufgaben bearbeitet und selbst mit dem Erwartungshorizont verglichen. Das ist genau das, was in einer Ex hilft.</p></section>
      ${good.length ? `<section class="sheet stack"><h3>Das saß</h3><ul class="reslist">${good.map(r => `<li><span class="ok-t">✓</span><span>${esc(r.p.q)}</span></li>`).join('')}</ul></section>` : ''}
      ${again.length ? `<section class="sheet stack"><h3>Das schaust du dir nochmal an</h3><ul class="reslist">${again.map(r => `<li><span class="no-t">!</span><span>${esc(r.p.q)} <span class="muted">(Kapitel ${r.p.ch}: ${esc(CHAP[r.p.ch].title)})</span></span></li>`).join('')}</ul></section>` : ''}
      <div class="row center"><button class="btn" data-act="zettel">Zum Lernzettel</button><button class="btn ghost" data-act="home">Zum Lernpfad</button></div>`;
  }

  // ---------- Parents ----------
  const grade = pct => pct >= 0.88 ? '1' : pct >= 0.75 ? '2' : pct >= 0.62 ? '3' : pct >= 0.5 ? '4' : pct >= 0.25 ? '5' : '6';
  function renderParents() {
    const conf = Object.values(P.conf).reduce((s, c) => ({ sr: s.sr + c.sr, sw: s.sw + c.sw, gr: s.gr + c.gr, gw: s.gw + c.gw }), { sr: 0, sw: 0, gr: 0, gw: 0 });
    const sureWrong = CARDS.filter(c => P.conf[c.id]?.sw).sort((a, b) => P.conf[b.id].sw - P.conf[a.id].sw);
    const hardest = CARDS.filter(c => P.c[c.id]?.w).sort((a, b) => P.c[b.id].w - P.c[a.id].w || streak(a.id) - streak(b.id)).slice(0, 10);
    const selfStats = Object.values(P.self).reduce((s, v) => ({ h: s.h + (v.h || 0), t: s.t + (v.t || 0), f: s.f + (v.f || 0) }), { h: 0, t: 0, f: 0 });
    const chRows = CHAPTERS.map(c => {
      const cs = chCards(c.n), p = pathOf(c.n);
      return `<tr><td>${c.n}. ${esc(c.title)}</td><td>${starHtml(c.n)}</td><td>${['e', 'a', 'w'].map(k => p[k] ? '✓' : '–').join(' ')}</td><td class="num">${cs.filter(k => mastered(k.id)).length}/${cs.length}</td><td class="num">${cs.filter(k => isDue(k.id)).length}</td></tr>`;
    }).join('');
    const probes = P.probe.slice().reverse().map(r => `<tr><td>${new Date(r.t).toLocaleDateString('de-DE')}</td><td class="num">${r.pts}/${r.max}</td><td class="num">${Math.round(100 * r.pts / r.max)} %</td><td class="num"><strong>${grade(r.pts / r.max)}</strong></td><td class="small">${r.items.filter(i => i.pts < i.max).map(i => esc(PRB[i.id] ? (PRB[i.id].q.length > 50 ? PRB[i.id].q.slice(0, 48) + '…' : PRB[i.id].q) : i.id)).join('<br>')}</td></tr>`).join('');
    const allRows = CHAPTERS.map(ch => `<tr><th colspan="4" style="padding-top:14px">${ch.n}. ${esc(ch.title)}</th></tr>` + chCards(ch.n).map(c => {
      const s = P.c[c.id];
      return `<tr><td>${esc(c.title)}</td><td class="lv" aria-label="Stufe ${streak(c.id)} von ${MASTER}">${dots(streak(c.id))}</td><td class="num">${s ? (s.due <= today() ? '<strong>heute</strong>' : fmtDay(s.due)) : '–'}</td><td class="num">${s?.w || 0}</td></tr>`;
    }).join('')).join('');
    const vids = VIDEOS.map(v => { const st = P.vid[v.id] || {}; return `<li>${esc(v.title)}: ${st.watched ? 'angeschaut' : 'noch nicht angeschaut'}${st.guess !== undefined ? `, Tipp vorher „${esc(v.pre.options[st.guess])}“ (${st.guess === v.pre.correct ? 'richtig' : 'falsch'})` : ''}</li>`; }).join('');
    const reset = resetAsk
      ? `<div class="confirm"><strong>Wirklich den ganzen Fortschritt löschen?</strong><span>Alle Karten, Fälligkeiten, Sterne, Selbstbewertungen, Video-Tipps und Probe-Ergebnisse werden gelöscht. Das lässt sich nicht rückgängig machen.</span><div class="row"><button class="btn" data-act="resetYes">Ja, alles löschen</button><button class="btn ghost" data-act="resetNo">Abbrechen</button></div></div>`
      : `<button class="btn ghost" data-act="resetAsk">Fortschritt zurücksetzen</button>`;
    return `
      <div class="qbar">${closeBtn()}<h2 style="flex:1">Für Eltern</h2></div>
      <section class="sheet stack">
        <span class="label">Stand</span>
        <div>${doneCount()} von ${TOTAL} Karten gelernt, heute fällig: ${dueIds().length}.</div>
        <div class="muted small">„Gelernt“ heißt: ${MASTER}-mal hintereinander richtig, jeweils am fälligen Tag (Abstände ${INTERVALS.join(', ')} Tage). Ein Fehler setzt die Karte zurück und holt sie am nächsten Tag wieder. Wer vor dem fälligen Tag übt, festigt, steigt aber nicht auf. Der Fortschritt bleibt nur auf diesem Gerät.</div>
        <div class="tablewrap"><table><thead><tr><th>Kapitel</th><th>Sterne</th><th>Pfad</th><th style="text-align:right">Gelernt</th><th style="text-align:right">Fällig</th></tr></thead><tbody>${chRows}</tbody></table></div>
        <div class="muted small">Pfad: Erklären, Abrufen, Anwenden. Sterne: ★ Pfad geschafft, ★★ jede Karte einmal richtig, ★★★ alle Karten gelernt.</div>
      </section>
      <section class="sheet stack">
        <span class="label">Probe-Modus (nur hier sichtbar)</span>
        ${probes ? `<div class="tablewrap"><table><thead><tr><th>Datum</th><th style="text-align:right">Punkte</th><th style="text-align:right">Anteil</th><th style="text-align:right">Note ca.</th><th>Lücken</th></tr></thead><tbody>${probes}</tbody></table></div>` : '<div>Noch keine Probe gemacht.</div>'}
        <div class="muted small">Grobe Einschätzung nach Selbstbewertung des Kindes mit dem Erwartungshorizont (1 ab 88 %, 2 ab 75 %, 3 ab 62 %, 4 ab 50 %, 5 ab 25 %). Ersetzt keine Bewertung durch die Lehrkraft. Das Kind sieht keine Note und keine Punkte.</div>
      </section>
      <section class="sheet stack">
        <span class="label">Wie gut schätzt sich das Kind ein?</span>
        <div class="kpis">
          <div class="kpi"><b>${conf.sr}</b>sicher und richtig</div>
          <div class="kpi ${conf.sw ? 'alert' : ''}"><b>${conf.sw}</b>sicher, aber falsch</div>
          <div class="kpi"><b>${conf.gr}</b>geraten und richtig</div>
          <div class="kpi"><b>${conf.gw}</b>geraten und falsch</div>
        </div>
        <div class="muted small">„Sicher, aber falsch“ ist am wichtigsten: Hier hat sich etwas Falsches festgesetzt. Diese Karten mit dem Heftsatz besprechen.</div>
        ${sureWrong.length ? `<ul class="reslist">${sureWrong.map(c => `<li><strong style="color:var(--bad)">${P.conf[c.id].sw}×</strong><span>${esc(c.title)}<br><span class="muted">${esc(c.heft || '')}</span></span></li>`).join('')}</ul>` : '<div>Noch keine Karte „sicher, aber falsch“ beantwortet.</div>'}
        <span class="label">Offene Antworten, selbst bewertet</span>
        <div>Hatte ich: ${selfStats.h} · teilweise: ${selfStats.t} · fehlte: ${selfStats.f}</div>
      </section>
      <section class="sheet stack">
        <span class="label">Schwierigste Karten</span>
        ${hardest.length ? `<ul class="reslist">${hardest.map(c => `<li><strong>${P.c[c.id].w}×</strong><span>${esc(c.title)}<br><span class="muted">${esc(c.heft || c.model || '')}</span></span></li>`).join('')}</ul>` : '<div>Noch keine Fehler.</div>'}
      </section>
      <section class="sheet stack">
        <span class="label">Hinweise zum Inhalt</span>
        <p class="note">Die Werte in Tabelle M4 sind ältere Zahlen (etwa Mitte der 1990er Jahre, die Emissionsanteile gelten für Deutschland). Heute liegen die Zunahmen höher. Im Erd-Atlas stehen die Zahlen nur im Lernzettel. Abgefragt werden nur die Kernaussagen (CO₂ größter Anteil, Methan stärkste Zunahme), die Zunahme der F-Gase gar nicht.</p>
        <p class="note">Die Inhalte stehen wörtlich wie im Heft, auch die Lösungen aus dem Heft. Nur echte Tippfehler sind korrigiert. Musterlösungen für unbeantwortete Aufgaben sind als „Ergänzung: Musterlösung“ gekennzeichnet. Diagramme M2 und M3 sind selbst nachgezeichnet, M3 vereinfacht ohne Zahlen.</p>
      </section>
      <section class="sheet stack"><span class="label">Videos</span><ul style="margin:0;padding-left:1.2em">${vids}</ul><div class="muted small">Die Videos liegen im Unterordner „videos/“. Fehlt eine Datei, zeigt der Erd-Atlas „Video folgt bald“.</div></section>
      <section class="sheet stack">
        <span class="label">Alle Karten</span>
        <div class="tablewrap"><table><thead><tr><th>Karte</th><th>Stufe</th><th style="text-align:right">Nächste</th><th style="text-align:right">Fehler</th></tr></thead><tbody>${allRows}</tbody></table></div>
      </section>
      <section class="stack">${reset}</section>`;
  }

  // ---------- Actions ----------
  function startPath(kind) {
    const list = PATH[chap][kind === 'abruf' ? 'abruf' : 'anwenden'];
    startRound(kind, list.map(itemOf), { ch: chap });
  }
  function startReview() {
    // Interleave: oldest due first within each chapter, then take turns between chapters
    const by = {};
    dueIds().forEach(id => (by[CARD[id].ch] = by[CARD[id].ch] || []).push(id));
    const pickIds = [];
    while (pickIds.length < REVIEW_MAX && Object.values(by).some(l => l.length)) Object.values(by).forEach(l => { if (l.length && pickIds.length < REVIEW_MAX) pickIds.push(l.shift()); });
    const ids = spread(shuffle(pickIds));
    if (!ids.length) return show('home');
    startRound('review', ids.map(id => ({ type: CARD[id].type, ids: [id] })));
  }
  function answerMC(sure) {
    const q = round.q;
    const ok = q.pending === q.correct;
    const r = log(q.ids[0], ok, { sure });
    q.answer = { i: q.pending, ok, r };
    finishItem(ok);
  }
  function checkType(arg) {
    const q = round.q, card = CARD[q.ids[0]];
    document.querySelectorAll('[data-in]').forEach(el => { q.vals[Number(el.dataset.in)] = el.value; });
    const res = card.fields.map((f, i) => fieldOk(f, q.vals[i] || ''));
    const ok = arg !== 'x' && res.every(Boolean);
    const r = log(q.ids[0], ok, arg === 'x' ? { sure: false } : { sure: arg === '1' });
    q.answer = { res: arg === 'x' ? res.map(() => false) : res, ok, r };
    finishItem(ok);
  }
  function orderTap(k) {
    const q = round.q, card = CARD[q.ids[0]];
    const want = q.placed.length;
    if (k === want) {
      q.placed.push(k);
      q.miss = 0;
      q.hint = '';
      q.shake = null;
    } else {
      q.errors++;
      q.miss++;
      q.shake = k;
      if (q.miss >= 2) {
        q.placed.push(want);
        q.help.add(want);
        q.miss = 0;
        q.hint = `Das war knifflig: An Stelle ${want + 1} kommt „${card.items[want]}“.`;
      } else q.hint = want === 0 ? 'Nicht ganz. Was kommt ganz am Anfang?' : `Nicht ganz. Was kommt nach „${card.items[want - 1]}“?`;
    }
    if (q.placed.length === card.items.length) {
      q.r = log(q.ids[0], q.errors === 0);
      return finishItem(q.errors === 0);
    }
    render();
  }

  const ACTIONS = {
    home: () => { resetAsk = false; round = null; pr = null; show('home'); },
    chapter: n => { chap = Number(n) || chap; round = null; show('chapter'); },
    learn: () => show('learn'),
    learned: () => { P.path[chap] = { ...pathOf(chap), e: true }; save(); startPath('abruf'); },
    path: kind => { if (round?.ch) chap = round.ch; startPath(kind); },
    review: () => startReview(),
    zettel: () => show('zettel'),
    parents: () => { resetAsk = false; show('parents'); },
    merk: i => { P.merk = Number(i); save(); render(); },
    speak: (arg, el) => speak(el.dataset.say),
    quit: () => {
      const r = round;
      round = null;
      if (r?.kind === 'video') { vd = { id: r.video, step: 'watch' }; show('video'); }
      else if (r?.ch) { chap = r.ch; show('chapter'); }
      else show('home');
    },
    next: () => next(),
    answer: i => { if (!round.q.answer) { round.q.pending = Number(i); render(); document.querySelector('.confask')?.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'nearest' }); } },
    conf: v => { if (round.q.pending !== undefined && !round.q.answer) answerMC(v === '1'); },
    unpick: () => { delete round.q.pending; render(); },
    typeCheck: arg => { if (!round.q.answer) checkType(arg); },
    orderTap: k => { if (!round.q.done) orderTap(Number(k)); },
    rcDel: i => { round.q.entries.splice(Number(i), 1); render(); },
    rcCheck: () => {
      const q = round.q, card = CARD[q.ids[0]];
      const inp = document.getElementById('rcIn');
      if (inp?.value.trim()) q.entries.push(...inp.value.split(/[,;\n]/).map(s => s.trim()).filter(Boolean));
      q.res = checkRecall(card, q.entries);
      const ok = !q.res.missing.length && q.res.inOrder;
      q.r = log(q.ids[0], ok);
      finishItem(ok);
    },
    selfShow: () => {
      const q = round.q;
      document.querySelectorAll('[data-in]').forEach(el => { q.vals[Number(el.dataset.in)] = el.value; });
      q.phase = 'rate';
      render();
      window.scrollTo(0, 0);
    },
    rate: arg => {
      const q = round.q;
      if (q.done) return;
      const [id, v] = arg.split('|');
      q.rate[id] = v;
      render();
    },
    selfDone: () => {
      const q = round.q;
      if (q.done || !q.ids.every(id => q.rate[id])) return;
      let all = true;
      q.ids.forEach(id => {
        const v = q.rate[id];
        const s = P.self[id] = P.self[id] || { h: 0, t: 0, f: 0 };
        s[v]++;
        log(id, v === 'h');
        if (v !== 'h') all = false;
      });
      finishItem(all);
    },
    m2Pick: n => {
      const q = round.q;
      if (q.fb || q.done) return;
      const card = CARD[q.ids[q.pos]];
      const ok = Number(n) === card.step;
      const r = log(card.id, ok);
      q.res[card.step] = ok;
      q.fb = { ok, step: card.step, chosen: Number(n), r, msg: pick(PRAISE) };
      if (q.pos + 1 >= q.ids.length) return finishItem(Object.values(q.res).every(Boolean));
      save();
      render();
      focusFeedback();
    },
    m2Next: () => { const q = round.q; q.pos++; q.fb = null; render(); },
    sortZone: z => {
      const q = round.q;
      if (!q.sel || q.done) return;
      const card = CARD[q.sel];
      const ok = card.gas === z;
      const r = log(card.id, ok);
      q.placed[card.id] = ok ? 'ok' : 'help';
      q.fb = { ok, id: card.id, zone: z, r };
      q.sel = q.order.find(id => !q.placed[id]) || null;
      if (q.ids.every(id => q.placed[id])) return finishItem(q.ids.every(id => q.placed[id] === 'ok'));
      save();
      render();
    },
    // videos
    openVideo: id => { const g = P.vid[id]?.guess; vd = { id, step: g === undefined ? 'pre' : 'watch' }; chap = VID[id].ch; show('video'); },
    preGuess: i => { P.vid[vd.id] = { ...(P.vid[vd.id] || {}), guess: Number(i) }; save(); vd.step = 'watch'; render(); },
    videoQuiz: () => { const v = VID[vd.id]; chap = v.ch; startRound('video', shuffle(CARDS.filter(c => c.video === v.id).map(c => ({ type: 'mc', ids: [c.id] }))), { video: v.id, ch: v.ch }); },
    // probe
    probe: () => { pr = { ids: pickProbe(), idx: 0, phase: 'write', vals: {}, checks: {} }; show('probe'); },
    prShow: () => {
      const p = PRB[pr.ids[pr.idx]];
      const el = document.querySelector('[data-pin]');
      if (el) pr.vals[p.id] = el.value;
      const val = pr.vals[p.id] || '';
      pr.checks[p.id] = p.crit.map(c => autoCrit(p, c, val));
      pr.phase = 'rate';
      render();
      window.scrollTo(0, 0);
    },
    prCheck: i => { const id = pr.ids[pr.idx]; pr.checks[id][Number(i)] = !pr.checks[id][Number(i)]; render(); },
    prNext: () => {
      pr.idx++;
      pr.phase = 'write';
      if (pr.idx >= pr.ids.length) {
        const items = pr.ids.map(id => ({ id, pts: Math.min(pmax(PRB[id]), pr.checks[id].filter(Boolean).length), max: pmax(PRB[id]) }));
        P.probe.push({ t: Date.now(), pts: items.reduce((s, i) => s + i.pts, 0), max: items.reduce((s, i) => s + i.max, 0), items });
        P.probe = P.probe.slice(-20);
        save();
      }
      render();
      window.scrollTo(0, 0);
    },
    resetAsk: () => { resetAsk = true; render(); document.querySelector('.confirm')?.scrollIntoView({ block: 'nearest' }); },
    resetNo: () => { resetAsk = false; render(); },
    resetYes: () => { P = fresh(); resetAsk = false; save(); show('home'); }
  };

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    ACTIONS[el.dataset.act]?.(el.dataset.arg, el);
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.in !== undefined && round?.q) round.q.vals[Number(t.dataset.in)] = t.value;
    if (t.dataset.pin && pr) pr.vals[t.dataset.pin] = t.value;
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.matches('[data-form="recall"]')) {
      const inp = document.getElementById('rcIn');
      const vals = (inp?.value || '').split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
      if (!vals.length) return;
      round.q.entries.push(...vals);
      render();
      document.getElementById('rcIn')?.focus({ preventScroll: true });
    }
  });
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target;
    if (e.key === 'Enter' && t.matches?.('input[data-in]')) {
      e.preventDefault();
      const all = [...document.querySelectorAll('input[data-in]')];
      const i = all.indexOf(t);
      if (i < all.length - 1) all[i + 1].focus();
      else document.querySelector('[data-act="typeCheck"]')?.focus();
      return;
    }
    if (view === 'quiz' && round?.q?.done && e.key === 'Enter' && !t.matches?.('textarea, input')) {
      if (document.activeElement?.id === 'nextBtn') return;
      e.preventDefault();
      next();
    }
  });
  window.addEventListener('pageshow', e => { if (e.persisted) { P = load(); render(); } });

  render();
</script>
